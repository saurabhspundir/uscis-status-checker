services:
  api:
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  client:
    ports:
      - "${CLIENT_PORT:-80}:80"
    build:
      args:
        VITE_API_BASE_URL: ""
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  poller:
    environment:
      DOTNET_ENVIRONMENT: Production
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
